name: Contolto Automation

on:
  schedule:
    # 6:30 AM Colombia (COT, UTC-5) es 11:30 UTC
    # Martes (2), Jueves (4) y Domingos (0)
    - cron: '30 11 * * 0,2,4'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub si quieres

jobs:
  run-contolto:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Main Process
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "## 🎱 Contolto v2 - Resumen de Ejecución" >> $GITHUB_STEP_SUMMARY
          echo "Ejecutado el: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Logs del Proceso" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          python main.py | tee -a execution.log
          cat execution.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "✨ *Proceso completado automáticamente por GitHub Actions*" >> $GITHUB_STEP_SUMMARY
